{% extends "base.html" %}
{% block title %}Upload — MEP Extractor{% endblock %}

{% block content %}
<div class="upload-wrap">
  <h2>Upload Drawing</h2>
  <p class="hint">Accepted formats: <strong>PDF</strong>, <strong>DXF</strong></p>

  <div id="drop-zone" class="drop-zone">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>Drag &amp; drop a file here, or<br>
       <label class="link-btn" for="file-input">browse</label>
    </p>
    <input id="file-input" type="file" accept=".pdf,.dxf" hidden>
    <p id="chosen-name" class="chosen-name"></p>
  </div>

  <button id="start-btn" class="btn btn-primary" disabled>Start Analysis</button>

  <div id="upload-progress" class="progress-wrap" hidden>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <p id="progress-label">Uploading…</p>
  </div>

  <div id="error-msg" class="alert alert-error" hidden></div>
</div>

<script>
const dropZone  = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const startBtn  = document.getElementById('start-btn');
const chosenName = document.getElementById('chosen-name');
const progressWrap = document.getElementById('upload-progress');
const progressFill = document.getElementById('progress-fill');
const progressLabel = document.getElementById('progress-label');
const errorMsg  = document.getElementById('error-msg');

let selectedFile = null;

function setFile(file) {
  selectedFile = file;
  chosenName.textContent = file.name;
  startBtn.disabled = false;
  dropZone.classList.add('has-file');
}

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) setFile(fileInput.files[0]);
});

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});

startBtn.addEventListener('click', () => {
  if (!selectedFile) return;
  errorMsg.hidden = true;
  startBtn.disabled = true;
  progressWrap.hidden = false;

  const data = new FormData();
  data.append('file', selectedFile);

  const xhr = new XMLHttpRequest();
  xhr.upload.addEventListener('progress', e => {
    if (e.lengthComputable) {
      const pct = Math.round(e.loaded / e.total * 100);
      progressFill.style.width = pct + '%';
      progressLabel.textContent = `Uploading… ${pct}%`;
    }
  });
  xhr.addEventListener('load', () => {
    if (xhr.status === 200) {
      const { job_id } = JSON.parse(xhr.responseText);
      progressLabel.textContent = 'Upload complete — starting analysis…';
      progressFill.style.width = '100%';
      window.location.href = '/results/' + job_id;
    } else {
      let msg = 'Upload failed.';
      try { msg = JSON.parse(xhr.responseText).error || msg; } catch(_) {}
      showError(msg);
    }
  });
  xhr.addEventListener('error', () => showError('Network error. Please try again.'));

  xhr.open('POST', '/upload');
  xhr.send(data);
});

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.hidden = false;
  progressWrap.hidden = true;
  startBtn.disabled = false;
}
</script>
{% endblock %}
