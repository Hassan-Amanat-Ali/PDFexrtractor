{% extends "base.html" %}
{% block title %}Analysis - MEP Extractor{% endblock %}
{% block content %}
<div class="waiting-card card">
  <div class="spinner"></div>
  <h2 id="status-title">Preparing analysis</h2>
  <p class="hint">{{ filename }}</p>
  <div class="stage-steps">{% for i in range(1,6) %}<div class="step" id="step-{{ i }}"></div>{% endfor %}</div>
  <p class="stage-label" id="stage-text">Loading status...</p>
  <p class="queue-label" id="queue-text"></p>
  <div class="waiting-actions">
    <a href="{{ url_for('index') }}" class="btn btn-ghost">All jobs</a>
    <form method="post" action="{{ url_for('cancel_job', job_id=job_id) }}" onsubmit="return confirm('Cancel this analysis?')">
      <button class="btn btn-warning">Cancel analysis</button>
    </form>
  </div>
</div>
<script>
const jobId={{ job_id|tojson }}, steps=[null,...document.querySelectorAll('.step')];
function poll(){fetch('/status/'+jobId).then(r=>r.json()).then(data=>{
  document.getElementById('stage-text').textContent=data.stage||'';
  document.getElementById('status-title').textContent=data.status==='queued'?'Queued':'Analysing drawing';
  document.getElementById('queue-text').textContent=data.queue_position?`Queue position: ${data.queue_position}`:'';
  for(let i=1;i<=5;i++)steps[i].className='step '+(i<data.stage_num?'done':i===data.stage_num?'active':'');
  if(['complete','failed','cancelled'].includes(data.status))location.href='/results/'+jobId;else setTimeout(poll,1500);
}).catch(()=>setTimeout(poll,3000));} poll();
</script>
{% endblock %}
