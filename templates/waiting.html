{% extends "base.html" %}
{% block title %}Analysing — MEP Extractor{% endblock %}

{% block head %}
<style>
  .waiting-card { max-width: 520px; margin: 80px auto; text-align: center; }
  .spinner { width: 48px; height: 48px; border: 4px solid #e5e7eb;
             border-top-color: #3b82f6; border-radius: 50%;
             animation: spin 0.8s linear infinite; margin: 0 auto 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stage-label { font-size: 1rem; color: #374151; margin: 0; }
  .stage-steps { display: flex; justify-content: center; gap: 8px; margin: 24px 0; }
  .step { width: 36px; height: 6px; border-radius: 3px; background: #e5e7eb; transition: background .4s; }
  .step.done { background: #3b82f6; }
  .step.active { background: #93c5fd; }
</style>
{% endblock %}

{% block content %}
<div class="waiting-card">
  <div class="spinner"></div>
  <h2>Analysing Drawing</h2>
  <p class="hint">{{ filename }}</p>

  <div class="stage-steps">
    {% for i in range(1, 6) %}
    <div class="step" id="step-{{ i }}"></div>
    {% endfor %}
  </div>

  <p class="stage-label" id="stage-text">Starting…</p>
</div>

<script>
const JOB_ID = {{ job_id | tojson }};
const steps  = [null, ...document.querySelectorAll('.step')];  // 1-indexed
const stageText = document.getElementById('stage-text');

function poll() {
  fetch('/status/' + JOB_ID)
    .then(r => r.json())
    .then(data => {
      stageText.textContent = data.stage || '';

      for (let i = 1; i <= 5; i++) {
        if (!steps[i]) continue;
        if (i < data.stage_num)       steps[i].className = 'step done';
        else if (i === data.stage_num) steps[i].className = 'step active';
        else                           steps[i].className = 'step';
      }

      if (data.status === 'done' || data.status === 'error') {
        window.location.href = '/results/' + JOB_ID;
      } else {
        setTimeout(poll, 1500);
      }
    })
    .catch(() => setTimeout(poll, 3000));
}

poll();
</script>
{% endblock %}
